version: '3.8'

services:
  mailsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailsentinel
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - BASE_URL=http://localhost:3001
      - API_BASE_URL=http://localhost:3001
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/google/callback}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      - SYNC_POLL_INTERVAL_SECONDS=${SYNC_POLL_INTERVAL_SECONDS:-60}
      - MAX_EMAILS_PER_SYNC=${MAX_EMAILS_PER_SYNC:-50}
    volumes:
      - sentinel-data:/app/data

volumes:
  sentinel-data:
    driver: local
